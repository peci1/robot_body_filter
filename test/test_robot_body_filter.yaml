empty:
  ros__parameters:
    filter1:
      name: "robot_body_filter"
      type: "robot_body_filter/RobotBodyFilterLaserScan"
      params: {}

test_chain_config:
  ros__parameters:
    filter1:
      name: "robot_body_filter"
      type: "robot_body_filter/RobotBodyFilterLaserScan"
      params:
        frames:
          fixed: 'odom'
          sensor: 'laser'
        filter:
          keep_clouds_organized: True
          model_pose_update_interval: 0.002  # do not get lower, the processing is then too slow
        test:
          negative: -1
        sensor:
          point_by_point: True
          min_distance: 0.1
          max_distance: 10.0
        ignored_links:
          bounding_sphere: ["antenna", "base_link::big_collision_box"]
          shadow_test: ["laser", "base_link::big_collision_box"]
        body_model:
          inflation:
            scale: 1.1
            padding: 0.01
            per_link:
              scale:
                "antenna::contains": 1.2
                "antenna::bounding_sphere": 1.2
                "antenna::bounding_box": 1.2
                "*::big_collision_box::contains": 2
                "*::big_collision_box::bounding_sphere": 2
                "*::big_collision_box::bounding_box": 2
                "*::big_collision_box::shadow": 3
                "wrong_type": True
                "wrong_type2": "str"
              padding:
                "laser::shadow": 0.015
                "base_link": 0.05
              all_wrong:
                "laser": "0.015"
                "base_link": "0.05"
          robot_description_topic: 'test_robot_description'
        transforms:
          buffer_length: 60.0
          timeout:
            reachable: 0.2
            unreachable: 0.2
        bounding_sphere:
          compute: True
          debug: False
          marker: False
          publish_cut_out_pointcloud: False
        bounding_box:
          compute: False
          debug: False
          marker: False
          publish_cut_out_pointcloud: False
        oriented_bounding_box:
          compute: False
          debug: False
          marker: False
          publish_cut_out_pointcloud: False
        local_bounding_box:
          frame_id: "base_link"
          compute: True
          debug: False
          marker: False
          publish_cut_out_pointcloud: False
        debug:
          pcl:
            inside: False
            clip: False
            shadow: False
          marker:
            contains: False
            shadow: False
        test_value: 1.1234

all_config:
  ros__parameters:
    filter1:
      name: "robot_body_filter"
      type: "robot_body_filter/RobotBodyFilterLaserScan"
      params:
        frames:
          fixed: 'odom'
          sensor: 'laser'
          filtering: 'base_link'
        filter:
          keep_clouds_organized: True
          model_pose_update_interval: 0.002  # do not get lower, the processing is then too slow
          do_clipping: True
          do_contains_test: True
          do_shadow_test: True
        sensor:
          point_by_point: True
          min_distance: 0.1
          max_distance: 10.0
        ignored_links:
          bounding_sphere: ["antenna", "base_link::big_collision_box"]
          shadow_test: ["laser", "base_link::big_collision_box"]
          bounding_box: ["base_link"]
          contains_test: ["base_link"]
          everywhere: ["base_link"]
        only_links: ["laser"]
        body_model:
          inflation:
            scale: 1.1
            padding: 0.01
          robot_description_topic: 'test_robot_description'
        transforms:
          buffer_length: 60.0
          timeout:
            reachable: 0.2
            unreachable: 0.2
          require_all_reachable: True
        bounding_sphere:
          compute: True
          debug: True
          marker: True
          publish_cut_out_pointcloud: True
        bounding_box:
          compute: True
          debug: True
          marker: True
          publish_cut_out_pointcloud: True
        oriented_bounding_box:
          compute: True
          debug: True
          marker: True
          publish_cut_out_pointcloud: True
        local_bounding_box:
          frame_id: "base_link"
          compute: True
          debug: True
          marker: True
          publish_cut_out_pointcloud: True
        debug:
          pcl:
            inside: True
            clip: True
            shadow: True
          marker:
            contains: True
            shadow: True
        test_value: 1.1234

