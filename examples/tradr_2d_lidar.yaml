# This is an example filter config for tracked vehicle Absolem from Czech Technical University's
# VRAS team. The robot is equipped with a 2D lidar attached to a rotating pivot point.
# Collision element base_link::big_collision_box is a virtual collision box attached above the
# robot's body that "captures" all the points generated by various cables and other stuff that is
# hard/impossible to be captured in the robot model.

# This config is meant to be loaded by laser_filters/scan_to_scan_filter_chain .
# See vlp16_params.yaml for an example how to load the filter into sensor_filters/pointcloud2_filter_chain .

scan_filter_chain:
  ros__parameters:
    filter1:
      name: RobotBodyFilter
      type: robot_body_filter/RobotBodyFilterLaserScan
      params:
        frames:
          fixed: 'odom'
          sensor: 'laser'
        filter:
          model_pose_update_interval: 0.002  # do not get lower, the processing is then too slow
        sensor:
          point_by_point: True
          min_distance: 0.03
          max_distance: 50.0
        ignored_links:
          bounding_sphere: ["antenna", "base_link::big_collision_box"]
          shadow_test: ["laser", "base_link::big_collision_box"]
        body_model:
          inflation:
            scale: 1.07
            padding: 0.01
          robot_description_topic: '/nifti_robot_description'
        transforms:
          buffer_length: 60.0
          timeout:
            reachable: 0.2
            unreachable: 0.2
        bounding_sphere:
          compute: True
          debug: False
          marker: False
          publish_cut_out_pointcloud: False
        bounding_box:
          compute: False
          debug: False
          marker: False
          publish_cut_out_pointcloud: False
        oriented_bounding_box:
          compute: False
          debug: False
          marker: False
          publish_cut_out_pointcloud: False
        local_bounding_box:
          frame_id: "base_link"
          compute: True
          debug: False
          marker: False
          publish_cut_out_pointcloud: False
        debug:
          pcl:
            inside: False
            clip: False
            shadow: False
          marker:
            contains: False
            shadow: False
