# This is an example filter config for tracked vehicle Jasmine from TU Darmstadt's Team Hector
# with a rotating lidar Velodyne VLP-16.
# It configures 4 instances of RobotBodyFilter - 2 for containment filtering, 2 for shadow
# filtering. The reason for having 4 different instances is the need to apply different values
# of body_model/inflation/scale and body_model/inflation/padding. Each instance acts on different
# sets of links specified in the `only_links` parameter.

# This config is meant to be loaded by laser_filters/cloud_to_cloud_filter_chain .
# See vlp16_params.yaml for an example how to load the filter into sensor_filters/pointcloud2_filter_chain .

cloud_filter_chain:
  ros__parameters:
    filter1:
      # Only containment filtering
      name: robot_body_filter_containment
      type: robot_body_filter/RobotBodyFilterPointCloud2
      params:
        debug:
          pcl:
            clip: false
            inside: false
            shadow: false
        sensor:
          point_by_point: false
          min_distance: 0.15
          max_distance: 0
        frames:
          sensor: spin_lidar_lidar_mount_link_fixed
          filtering: spin_lidar_lidar_mount_link_fixed
          output: spin_lidar_lidar_mount_link_fixed
          fixed: spin_lidar_lidar_mount_link_fixed
        body_model:
          inflation:
            scale: 1.0
            padding: 0.03
          robot_description_topic: /robot_description
        filter:
          do_clipping: true
          do_contains_test: true
          do_shadow_test: false
        only_links:
          - chassis_link
          - left_track_link
          - right_track_link
          - autonomy_box_link
          - arm_pitch_link_0
          - arm_pitch_link_1
          - arm_pitch_link_2
          - arm_roll_link
          - arm_yaw_link
          - sensor_head_yaw_link
          - sensor_head_pitch_link
          - arm_rgbd_cam_link
          - arm_thermal_cam_frame
    filter2:
      # Containment filtering for gripper with more padding (cables, higher uncertainty)
      name: robot_body_filter_containment_gripper
      type: robot_body_filter/RobotBodyFilterPointCloud2
      params:
        debug:
          pcl:
            clip: false
            inside: true
            shadow: false
        sensor:
          point_by_point: false
          min_distance: 0.15
          max_distance: 0
        frames:
          sensor: spin_lidar_lidar_mount_link_fixed
          filtering: spin_lidar_lidar_mount_link_fixed
          output: spin_lidar_lidar_mount_link_fixed
          fixed: spin_lidar_lidar_mount_link_fixed
        body_model:
          inflation:
            scale: 1.0
            padding: 0.1
          robot_description_topic: /robot_description
        filter:
          do_clipping: false
          do_contains_test: true
          do_shadow_test: false
        only_links:
          - gripper_palm_link
          - gripper_finger_link_0
          - gripper_finger_link_1
    filter3:
      # Raycast filter for arm and sensor head
      name: robot_body_filter_shadow
      type: robot_body_filter/RobotBodyFilterPointCloud2
      params:
        debug:
          pcl:
            clip: false
            inside: false
            shadow: true
        sensor:
          point_by_point: false
          min_distance: 0.15
          max_distance: 0
        frames:
          sensor: spin_lidar_lidar_mount_link_fixed
          filtering: spin_lidar_lidar_mount_link_fixed
          output: spin_lidar_lidar_mount_link_fixed
          fixed: spin_lidar_lidar_mount_link_fixed
        body_model:
          inflation:
            scale: 1.0
            padding: 0.01
          robot_description_topic: /robot_description
        filter:
          do_clipping: false
        only_links:
          - arm_pitch_link_0
          - arm_pitch_link_1
          - arm_pitch_link_2
          - arm_roll_link
          - arm_yaw_link
          - gripper_palm_link
          - sensor_head_yaw_link
          - sensor_head_pitch_link
    filter4:
      # Raycast filter for chassis and gripper fingers with more padding
      name: robot_body_filter_shadow_chassis
      type: robot_body_filter/RobotBodyFilterPointCloud2
      params:
        debug:
          pcl:
            clip: false
            inside: false
            shadow: false
        sensor:
          point_by_point: false
          min_distance: 0.15
          max_distance: 0
        frames:
          sensor: spin_lidar_lidar_mount_link_fixed
          filtering: spin_lidar_lidar_mount_link_fixed
          output: spin_lidar_lidar_mount_link_fixed
          fixed: spin_lidar_lidar_mount_link_fixed
        body_model:
          inflation:
            scale: 1.0
            padding: 0.02
          robot_description_param: /robot_description
        filter:
          do_clipping: false
          do_contains_test: false
          do_shadow_test: true
        only_links:
          - chassis_link
          - left_track_link
          - right_track_link
          - sensor_head_yaw_link
          - sensor_head_pitch_link
          - arm_rgbd_cam_link
          - arm_thermal_cam_frame
          - gripper_finger_link_0
          - gripper_finger_link_1
